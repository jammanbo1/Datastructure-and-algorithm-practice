name: 전월세 실거래 받기

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 한국 시간 새벽 3시 (UTC 18시)
  workflow_dispatch:        # Actions 탭에서 바로 돌려 볼 수도 있어요

permissions:
  contents: write           # 받은 data/listings.json 을 저장소에 올리려고 필요해요

concurrency:
  group: fetch-rent
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 국토교통부 API에서 받기
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
        run: python scripts/fetch_rent.py

      - name: 바뀐 게 있으면 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet; then
            echo "바뀐 거래가 없어요."
          else
            git commit -m "전월세 실거래 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
